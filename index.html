<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Bella Notte Café — Cozy Coffee Story</title>
  <meta name="description" content="A cozy coffee shop game: brew drinks, get to know your regulars and grow your little café on the corner.">
  <meta name="theme-color" content="#1e1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bella Notte">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/pressstart-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="scene-wrap">
      <canvas id="scene"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-pill" id="hud-coins"><span class="coin"></span><span id="hud-coins-val">0</span></div>
        <div class="hud-pill" id="hud-combo"></div>
        <div class="hud-pill hidden" id="hud-nico"><span class="nico-bar"><i></i></span><span class="nico-name"></span></div>
        <div class="hud-pill" id="hud-time"><span class="clock"></span><span id="hud-time-val">2:30</span></div>
        <button class="hud-pill hud-btn" id="btn-pause" aria-label="Pause"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#3b2a22"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#3b2a22"/></svg></button>
      </div>
      <div id="banner"></div>
      <div id="talk" class="hidden"><span class="who"></span><span class="say"></span></div>
      <div id="scg" class="off"><i class="rain"></i></div>
      <div id="shud" class="hidden"><span class="hud-pill" id="shud-title"></span><span class="shud-btns"><button class="hud-pill hud-btn" id="shud-music" data-act="music" aria-label="Music"></button><button class="hud-pill hud-btn" data-act="story-quit" aria-label="Leave">✕</button></span></div>
      <div id="sphone" class="hidden"></div>
      <div id="stitle" class="hidden"></div>
      <div id="hint" class="hidden"></div>
      <div id="toasts"></div>
    </div>
    <div id="sdock" class="hidden"><div id="sbox" class="hidden"><span class="who"></span><span class="say"></span><div class="choices"></div></div></div>
    <div id="station" class="hidden">
      <div id="cups-row">
        <div id="cups"><canvas id="bar"></canvas></div>
        <button id="btn-trash" class="trash" aria-label="Pour out"></button>
      </div>
      <div id="ingredients"></div>
    </div>
    <div id="scard" class="hidden"></div>
    <div id="overlay" class="hidden"><div id="panel"></div></div>
    <div id="modal" class="hidden"><div id="modal-card"></div></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/art.js"></script>
  <script src="js/events.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/talk.js"></script>
  <script src="js/shift.js"></script>
  <script src="js/bar.js"></script>
  <script src="js/story.js"></script>
  <script src="js/story/prologue.js"></script>
  <script src="js/story/ch1.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
